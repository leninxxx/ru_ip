# Ежедневная сборка списка RU-сетей и коммит в репозиторий.
# MikroTik забирает результат по raw-URL:
#   https://raw.githubusercontent.com/<ваш-логин>/<репо>/main/ru_ranges_timeout.rsc
name: ru-ranges

on:
  schedule:
    - cron: "17 3 * * *"   # ежедневно, 03:17 UTC — после обновления delegated-файла RIPE
  workflow_dispatch: {}    # ручной запуск из вкладки Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate RU ranges
        run: python generate_ru_ranges.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- ru_ranges_timeout.rsc ru_ranges.rsc; then
            echo "Список не изменился — коммит не нужен"
          else
            git config user.name "ru-ranges-bot"
            git config user.email "ru-ranges-bot@users.noreply.github.com"
            git add ru_ranges_timeout.rsc ru_ranges.rsc
            git commit -m "RU ranges: $(date -u +%Y-%m-%d)"
            git push
          fi
